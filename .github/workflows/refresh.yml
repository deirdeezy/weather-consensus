# Hourly: pull sources that posted a new run, publish, save data, deploy Pages.
# Design, limits and sources: docs/HOSTING.md.
name: Hourly refresh

on:
  schedule:
    - cron: "17 * * * *"  # minute 17: away from the busy top of the hour
  workflow_dispatch:

permissions: {}  # each job asks only for what it needs

# One queue for every job that writes the data branch or deploys Pages
# (shared with nightly.yml): runs wait their turn, none is dropped or cancelled.
concurrency:
  group: data-branch
  queue: max
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write  # push the data branch
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the data branch into data/store
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: data
          path: data/store
          fetch-depth: 1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen --no-dev

      - name: Refresh, publish, save data
        run: bash backend/ci/hourly.sh

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: public
          retention-days: 1

  deploy:
    needs: refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write     # deploy to GitHub Pages
      id-token: write  # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
